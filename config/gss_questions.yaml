    in them? Congress.
  options:
    - {code: 1, text: "A great deal"}
    - {code: 2, text: "Only some"}
    - {code: 3, text: "Hardly any"}

- qid: gss:confinan
  var: confinan
  qtype: single_choice
  text: >-
    I am going to name an institution in this country. As far as the people
    running this institution are concerned, would you say you have a great
    deal of confidence, only some confidence, or hardly any confidence at all
    in them? Banks and financial institutions.
  options:
    - {code: 1, text: "A great deal"}
    - {code: 2, text: "Only some"}
    - {code: 3, text: "Hardly any"}

- qid: gss:conarmy
  var: conarmy
  qtype: single_choice
  text: >-
    I am going to name an institution in this country. As far as the people
    running this institution are concerned, would you say you have a great
    deal of confidence, only some confidence, or hardly any confidence at all
    in them? The military.
  options:
    - {code: 1, text: "A great deal"}
    - {code: 2, text: "Only some"}
    - {code: 3, text: "Hardly any"}

- qid: gss:happy
  var: happy
  qtype: single_choice
  text: >-
    Taken all together, how would you say things are these days - would you
    say that you are very happy, pretty happy, or not too happy?
  options:
    - {code: 1, text: "Very happy"}
    - {code: 2, text: "Pretty happy"}
    - {code: 3, text: "Not too happy"}

- qid: gss:health
  var: health
  qtype: single_choice
  text: >-
    Would you say your own health, in general, is excellent, good, fair, or
    poor?
  options:
    - {code: 1, text: "Excellent"}
    - {code: 2, text: "Good"}
    - {code: 3, text: "Fair"}
    - {code: 4, text: "Poor"}

- qid: gss:satfin
  var: satfin
  qtype: single_choice
  text: >-
    We are interested in how people are getting along financially these days.
    So far as you and your family are concerned, would you say that you are
    pretty well satisfied with your present financial situation, more or less
    satisfied, or not satisfied at all?
  options:
    - {code: 1, text: "Pretty well satisfied"}
    - {code: 2, text: "More or less satisfied"}
    - {code: 3, text: "Not satisfied at all"}

- qid: gss:polviews
  var: polviews
  qtype: single_choice
  text: >-
    We hear a lot of talk these days about liberals and conservatives. I'm
    going to show you a seven-point scale on which the political views that
    people might hold are arranged from extremely liberal - point 1 - to
    extremely conservative - point 7. Where would you place yourself on this
    scale?
  options:
    - {code: 1, text: "Extremely liberal"}
    - {code: 2, text: "Liberal"}
    - {code: 3, text: "Slightly liberal"}
    - {code: 4, text: "Moderate, middle of the road"}
    - {code: 5, text: "Slightly conservative"}
    - {code: 6, text: "Conservative"}
    - {code: 7, text: "Extremely conservative"}

- qid: gss:partyid
  var: partyid
  qtype: single_choice
  text: >-
    Generally speaking, do you usually think of yourself as a Republican,
    Democrat, Independent, or what?
  options:
    - {code: 0, text: "Strong Democrat"}
    - {code: 1, text: "Not very strong Democrat"}
    - {code: 2, text: "Independent, close to Democrat"}
    - {code: 3, text: "Independent"}
    - {code: 4, text: "Independent, close to Republican"}
    - {code: 5, text: "Not very strong Republican"}
    - {code: 6, text: "Strong Republican"}
    - {code: 7, text: "Other party", volunteered: true}

- qid: gss:eqwlth
  var: eqwlth
  qtype: single_choice
  text: >-
    Some people think that the government in Washington ought to reduce the
    income differences between the rich and the poor, perhaps by raising the
    taxes of wealthy families or by giving income assistance to the poor.
    Others think that the government should not concern itself with reducing
    this income difference between the rich and the poor. Here is a card with
    a scale from 1 to 7. Think of a score of 1 as meaning that the government
    ought to reduce the income differences between rich and poor, and a score
    of 7 meaning that the government should not concern itself with reducing
    income differences. What score between 1 and 7 comes closest to the way
    you feel?
  options:
    - {code: 1, text: "1 - Government should reduce income differences"}
    - {code: 2, text: "2"}
    - {code: 3, text: "3"}
    - {code: 4, text: "4"}
    - {code: 5, text: "5"}
    - {code: 6, text: "6"}
    - {code: 7, text: "7 - Government should not concern itself with income differences"}

- qid: gss:helppoor
  var: helppoor
  qtype: single_choice
  text: >-
    Some people think that the government in Washington should do everything
    possible to improve the standard of living of all poor Americans; they
    are at Point 1 on this card. Other people think it is not the
    government's responsibility, and that each person should take care of
    himself; they are at Point 5. Where would you place yourself on this
    scale, or haven't you made up your mind on this?
  options:
    - {code: 1, text: "1 - Government should improve living standards"}
    - {code: 2, text: "2"}
    - {code: 3, text: "3 - Agree with both"}
    - {code: 4, text: "4"}
    - {code: 5, text: "5 - People should take care of themselves"}
