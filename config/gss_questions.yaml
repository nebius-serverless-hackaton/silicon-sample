# Calibration questions, verbatim from the GSS codebook. Option codes verified
# against value labels in gss7224_r3.dta. `volunteered: true` marks answers
# respondents gave spontaneously but interviewers did not read out -
# templates may present them differently. `drop_codes` are codes valid in the
# data but excluded from both prompts and targets.

- qid: gss:abany
  var: abany
  qtype: single_choice
  text: >-
    Please tell me whether or not you think it should be possible for a
    pregnant woman to obtain a legal abortion if the woman wants it for any
    reason?
  options:
    - {code: 1, text: "Yes"}
    - {code: 2, text: "No"}

- qid: gss:cappun
  var: cappun
  qtype: single_choice
  text: >-
    Do you favor or oppose the death penalty for persons convicted of murder?
  options:
    - {code: 1, text: "Favor"}
    - {code: 2, text: "Oppose"}

- qid: gss:grass
  var: grass
  qtype: single_choice
  text: >-
    Do you think the use of marijuana should be made legal or not?
  options:
    - {code: 1, text: "Should be legal"}
    - {code: 2, text: "Should not be legal"}

- qid: gss:gunlaw
  var: gunlaw
  qtype: single_choice
  text: >-
    Would you favor or oppose a law which would require a person to obtain a
    police permit before he or she could buy a gun?
  options:
    - {code: 1, text: "Favor"}
    - {code: 2, text: "Oppose"}

- qid: gss:homosex
  var: homosex
  qtype: single_choice
  text: >-
    What about sexual relations between two adults of the same sex - do you
    think it is always wrong, almost always wrong, wrong only sometimes, or
    not wrong at all?
  options:
    - {code: 1, text: "Always wrong"}
    - {code: 2, text: "Almost always wrong"}
    - {code: 3, text: "Wrong only sometimes"}
    - {code: 4, text: "Not wrong at all"}
  drop_codes: [5]

- qid: gss:prayer
  var: prayer
  qtype: single_choice
  text: >-
    The United States Supreme Court has ruled that no state or local
    government may require the reading of the Lord's Prayer or Bible verses
    in public schools. What are your views on this - do you approve or
    disapprove of the court ruling?
  options:
    - {code: 1, text: "Approve"}
    - {code: 2, text: "Disapprove"}

- qid: gss:fepol
  var: fepol
  qtype: single_choice
  text: >-
    Do you agree or disagree with this statement: Most men are better suited
    emotionally for politics than are most women.
  options:
    - {code: 1, text: "Agree"}
    - {code: 2, text: "Disagree"}

- qid: gss:natenvir
  var: natenvir
  qtype: single_choice
  text: >-
    We are faced with many problems in this country, none of which can be
    solved easily or inexpensively. I'm going to name one of these problems,
    and I'd like you to tell me whether you think we're spending too much
    money on it, too little money, or about the right amount. Improving and
    protecting the environment - are we spending too much, too little, or
    about the right amount?
  options:
    - {code: 1, text: "Too little"}
    - {code: 2, text: "About right"}
    - {code: 3, text: "Too much"}

- qid: gss:natheal
  var: natheal
  qtype: single_choice
  text: >-
    We are faced with many problems in this country, none of which can be
    solved easily or inexpensively. I'm going to name one of these problems,
    and I'd like you to tell me whether you think we're spending too much
    money on it, too little money, or about the right amount. Improving and
    protecting the nation's health - are we spending too much, too little, or
    about the right amount?
  options:
    - {code: 1, text: "Too little"}
    - {code: 2, text: "About right"}
    - {code: 3, text: "Too much"}

