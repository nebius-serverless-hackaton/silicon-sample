- qid: gss:trust
  var: trust
  qtype: single_choice
  text: >-
    Generally speaking, would you say that most people can be trusted or that
    you can't be too careful in dealing with people?
  options:
    - {code: 1, text: "Most people can be trusted"}
    - {code: 2, text: "You can't be too careful in dealing with people"}
    - {code: 3, text: "Depends", volunteered: true}

- qid: gss:fair
  var: fair
  qtype: single_choice
  # probe-calibrated (2026-07-12): listed=46% hedge vs 11% real; last-resort=2%, best MAE
  volunteered_style: last-resort
  text: >-
    Do you think most people would try to take advantage of you if they got a
    chance, or would they try to be fair?
  options:
    - {code: 1, text: "Would take advantage of you"}
    - {code: 2, text: "Would try to be fair"}
    - {code: 3, text: "Depends", volunteered: true}

- qid: gss:helpful
  var: helpful
  qtype: single_choice
  # probe-calibrated (2026-07-12): listed=82% hedge vs 16% real; last-resort=20%, MAE 43.9->13.8
  volunteered_style: last-resort
  text: >-
    Would you say that most of the time people try to be helpful, or that
    they are mostly just looking out for themselves?
  options:
    - {code: 1, text: "Try to be helpful"}
    - {code: 2, text: "Just look out for themselves"}
    - {code: 3, text: "Depends", volunteered: true}

- qid: gss:courts
  var: courts
  qtype: single_choice
  text: >-
    In general, do you think the courts in this area deal too harshly or not
    harshly enough with criminals?
  options:
    - {code: 1, text: "Too harshly"}
    - {code: 2, text: "Not harshly enough"}
    - {code: 3, text: "About right", volunteered: true}

- qid: gss:conlegis
  var: conlegis
