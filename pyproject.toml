[project]
name = "silicon"
version = "0.1.0"
description = "Synthetic population panel for opinion replication (Nebius hackathon)"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.15",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "duckdb>=1.1",
    "boto3>=1.35",
    "openai>=1.54",
    "pandas>=2.2",
    "pyreadstat>=1.2",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "numpy>=2.0",
]

[project.scripts]
silicon = "silicon.cli:app"

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/silicon"]
